<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Shakal & Color Bot</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <header>
      <h2>🎨 Шакал & Цветокор</h2>
    </header>

    <main>
      <div class="canvas-container" id="canvasContainer">
        <div id="placeholder" class="placeholder">
          <div class="placeholder-icon">🖼</div>
          <div class="placeholder-text">Нажми «Загрузить картинку»</div>
        </div>
        <canvas id="imageCanvas"></canvas>
        <div class="canvas-hint" id="canvasHint" style="display: none">
          👆 Тап — на весь экран
        </div>
      </div>

      <div class="controls">
        <input type="file" id="fileInput" accept="image/*" />

        <div class="top-buttons">
          <label for="fileInput" class="btn" id="uploadBtn">📁 Загрузить</label>
          <button class="btn btn-secondary" id="resetBtn">🔄 Сброс</button>
          <button class="btn btn-secondary" id="downloadBtn">💾 Скачать</button>
        </div>

        <div class="presets">
          <button class="preset-btn" data-preset="meme">😹 Мем</button>
          <button class="preset-btn" data-preset="acid">🧪 Кислота</button>
          <button class="preset-btn" data-preset="vintage">📼 Винтаж</button>
          <button class="preset-btn" data-preset="glitch">👾 Глитч</button>
        </div>

        <div class="control-group">
          <label>Шакализация (Пиксели)</label>
          <div class="stepper" data-target="shakal">
            <button class="step-btn" data-dir="-1">−</button>
            <span class="step-value" id="valShakal">1</span>
            <button class="step-btn" data-dir="1">+</button>
          </div>
          <input
            type="hidden"
            id="shakal"
            value="1"
            data-min="1"
            data-max="50"
            data-step="1"
          />
        </div>

        <div class="control-group">
          <label>Яркость</label>
          <div class="stepper" data-target="brightness">
            <button class="step-btn" data-dir="-1">−</button>
            <span class="step-value" id="valBrightness">100%</span>
            <button class="step-btn" data-dir="1">+</button>
          </div>
          <input
            type="hidden"
            id="brightness"
            value="100"
            data-min="0"
            data-max="200"
            data-step="5"
          />
        </div>

        <div class="control-group">
          <label>Контраст</label>
          <div class="stepper" data-target="contrast">
            <button class="step-btn" data-dir="-1">−</button>
            <span class="step-value" id="valContrast">100%</span>
            <button class="step-btn" data-dir="1">+</button>
          </div>
          <input
            type="hidden"
            id="contrast"
            value="100"
            data-min="0"
            data-max="200"
            data-step="5"
          />
        </div>

        <div class="control-group">
          <label>Насыщенность</label>
          <div class="stepper" data-target="saturate">
            <button class="step-btn" data-dir="-1">−</button>
            <span class="step-value" id="valSaturate">100%</span>
            <button class="step-btn" data-dir="1">+</button>
          </div>
          <input
            type="hidden"
            id="saturate"
            value="100"
            data-min="0"
            data-max="200"
            data-step="5"
          />
        </div>

        <div class="control-group">
          <label>💧 Шум</label>
          <div class="stepper" data-target="noise">
            <button class="step-btn" data-dir="-1">−</button>
            <span class="step-value" id="valNoise">0%</span>
            <button class="step-btn" data-dir="1">+</button>
          </div>
          <input
            type="hidden"
            id="noise"
            value="0"
            data-min="0"
            data-max="100"
            data-step="5"
          />
        </div>

        <div class="control-group">
          <label>📺 Глитч</label>
          <div class="stepper" data-target="glitch">
            <button class="step-btn" data-dir="-1">−</button>
            <span class="step-value" id="valGlitch">0%</span>
            <button class="step-btn" data-dir="1">+</button>
          </div>
          <input
            type="hidden"
            id="glitch"
            value="0"
            data-min="0"
            data-max="100"
            data-step="5"
          />
        </div>

        <div class="control-group">
          <label>🌈 Хроматика</label>
          <div class="stepper" data-target="chromatic">
            <button class="step-btn" data-dir="-1">−</button>
            <span class="step-value" id="valChromatic">0px</span>
            <button class="step-btn" data-dir="1">+</button>
          </div>
          <input
            type="hidden"
            id="chromatic"
            value="0"
            data-min="0"
            data-max="20"
            data-step="1"
          />
        </div>
      </div>
    </main>

    <!-- МОДАЛКА ПОЛНОЭКРАННОГО ПРОСМОТРА -->
    <div
      class="fullscreen-preview"
      id="fullscreenPreview"
      style="display: none"
    >
      <canvas id="fullscreenCanvas"></canvas>
      <button class="fullscreen-close" id="fullscreenClose">✕</button>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
