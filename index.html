<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Shakal & Color Bot</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <header>
      <h2>🎨 Шакал & Цветокор</h2>
    </header>

    <main>
      <div class="canvas-container" id="canvasContainer">
        <canvas id="imageCanvas"></canvas>
        <img id="previewImage" alt="preview" style="display: none" />
      </div>

      <div class="controls">
        <input type="file" id="fileInput" accept="image/*" />
        <button class="btn" id="uploadBtn">📁 Загрузить картинку</button>

        <div class="control-group">
          <label>Шакализация (Пиксели) <span id="valShakal">1</span></label>
          <input type="range" id="shakal" min="1" max="50" value="1" />
        </div>

        <div class="control-group">
          <label>Яркость <span id="valBrightness">100</span>%</label>
          <input type="range" id="brightness" min="0" max="200" value="100" />
        </div>

        <div class="control-group">
          <label>Контраст <span id="valContrast">100</span>%</label>
          <input type="range" id="contrast" min="0" max="200" value="100" />
        </div>

        <div class="control-group">
          <label>Насыщенность <span id="valSaturate">100</span>%</label>
          <input type="range" id="saturate" min="0" max="200" value="100" />
        </div>

        <button
          class="btn btn-secondary"
          id="resetBtn"
          style="margin-bottom: 10px"
        >
          🔄 Сбросить настройки
        </button>

        <p
          id="hint"
          style="
            display: none;
            text-align: center;
            font-size: 13px;
            color: #a0a0a0;
            margin: 8px 0 0 0;
          "
        >
          📲 Удерживай картинку, чтобы сохранить
        </p>
      </div>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
