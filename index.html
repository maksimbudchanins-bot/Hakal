<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Shakal & Color Bot</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- Подключаем Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <header>
      <h2>🎨 Шакал & Цветокор</h2>
    </header>

    <main>
      <div class="canvas-container">
        <canvas id="imageCanvas"></canvas>
      </div>

      <div class="controls">
        <input type="file" id="fileInput" accept="image/*" />
        <button class="btn" id="uploadBtn">📁 Загрузить картинку</button>

        <div class="control-group">
          <label>Шакализация (Пиксели) <span id="valShakal">1</span></label>
          <input type="range" id="shakal" min="1" max="50" value="1" />
        </div>

        <div class="control-group">
          <label>Яркость <span id="valBrightness">100</span>%</label>
          <input type="range" id="brightness" min="0" max="200" value="100" />
        </div>

        <div class="control-group">
          <label>Контраст <span id="valContrast">100</span>%</label>
          <input type="range" id="contrast" min="0" max="200" value="100" />
        </div>

        <div class="control-group">
          <label>Насыщенность <span id="valSaturate">100</span>%</label>
          <input type="range" id="saturate" min="0" max="200" value="100" />
        </div>

        <button class="btn btn-secondary" id="downloadBtn">
          💾 Скачать результат
        </button>
      </div>
    </main>

    <!-- Подключаем скрипты -->
    <script src="js/app.js"></script>
  </body>
</html>
